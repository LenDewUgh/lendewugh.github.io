<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a schedule on Pay Tracker</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1c1d1a;
    --muted: #5f625c;
    --accent: #0074c8;
    --border: #e2e1da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f;
      --surface: #1e2018;
      --text: #f1f0e9;
      --muted: #a2a69b;
      --accent: #69c0f0;
      --border: #2e3128;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 26px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .app { color: var(--accent); font-weight: 600; }
  p { color: var(--muted); margin: 0 0 18px; }
  .cta {
    display: block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 13px 18px;
    border-radius: 12px;
    margin-bottom: 10px;
  }
  @media (prefers-color-scheme: dark) { .cta { color: #14150f; } }
  .secondary {
    display: block;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .fine { font-size: 0.82rem; margin: 20px 0 0; }
</style>
</head>
<body>
<main>
  <h1>You've been invited to a schedule on <span class="app">Pay Tracker</span></h1>
  <p>Install Pay Tracker, then tap the invite link again — it'll open straight to the schedule.</p>

  <!-- TODO: replace with the real App Store URL -->
  <a class="cta" href="https://apps.apple.com/app/id6763399577">Get Pay Tracker</a>
  <a class="secondary" id="retry" href="#">I already have it — open the invite</a>

  <p class="fine">If the app is installed and this page still appears, open Pay Tracker first, then tap the link again.</p>
</main>
<script>
  // The share URL travels in ?s=. Hand it to the app via its own URL scheme.
  //
  // Why this exists: if the apple-app-site-association file is being served
  // correctly, iOS opens Pay Tracker directly and this page is never seen. If it
  // isn't (GitHub Pages can't set a Content-Type, and Apple is picky), the link
  // lands here instead — and this redirect still gets the invite into the right
  // app. Nothing happens if the app isn't installed, so the Get button stays.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var share = params.get('s');
    var retry = document.getElementById('retry');
    retry.href = window.location.href;

    if (!share) return;

    var appURL = 'paytracker://join?s=' + encodeURIComponent(share);
    retry.href = appURL;

    // Give the browser a beat to paint before attempting the handoff, so the
    // fallback content is already on screen if nothing is installed.
    setTimeout(function () { window.location.href = appURL; }, 250);
  })();
</script>
</body>
</html>
